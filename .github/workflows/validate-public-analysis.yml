name: Validate public aggregate analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-public.txt
      - run: python -m pip install -r requirements-public.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q open_analysis_code tests
      - run: python open_analysis_code/00_audit_public_release.py --root open_analysis_code
